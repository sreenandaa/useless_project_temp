<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Useless</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="screen">

        <!-- Background decoration -->
        <div class="background-glow"></div>

        <div class="content">

            <p class="small-text">SOMETHING IS WAITING FOR YOU</p>

            <h1 id="mainTitle">
                Something is waiting.
            </h1>

            <p id="description" class="description">
                We just don't know where it is.
            </p>

            <div id="instruction" class="instruction">
                <span>Maybe you can find it.</span>

                <strong>
                    SPOT SOMETHING PINK
                </strong>

                <small>
                    Any shade. Any object. We don't judge.
                </small>
            </div>

            <button id="startButton">
                BEGIN THE SEARCH
            </button>

        </div>

        <!-- Decorative pink dots -->
        <div class="pink-dot dot-one"></div>
        <div class="pink-dot dot-two"></div>
        <div class="pink-dot dot-three"></div>
        <div class="pink-dot dot-four"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
